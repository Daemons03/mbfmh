<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#4f8a3c" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c2a1a" media="(prefers-color-scheme: dark)">
    <title>Ferme Tranquille</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
    <link rel="stylesheet" href="assets/css/app.css">
    <script type="module" src="assets/js/main.js"></script>
</head>
<body>
    <div id="loading" class="loading">🌾 Chargement…</div>

    <section id="login" class="login" hidden>
        <form id="login-form" class="login-card" autocomplete="on">
            <h1>🌾 Ferme Tranquille</h1>
            <label>Identifiant
                <input name="login" autocomplete="username" required autocapitalize="none" spellcheck="false">
            </label>
            <label>Mot de passe
                <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <p id="login-error" class="form-error" role="alert" hidden></p>
            <button type="submit" class="btn btn-primary">Se connecter</button>
        </form>
    </section>

    <div id="app" class="app" hidden>
        <header id="topbar" class="topbar"></header>

        <main class="map-wrap">
            <div id="mode-banner" class="mode-banner" hidden></div>
            <div id="map" class="map" tabindex="0" aria-label="Ferme">
                <div id="grid" class="grid"></div>
            </div>
            <div class="zoom">
                <button type="button" class="btn-round" id="zoom-in" aria-label="Zoomer">+</button>
                <button type="button" class="btn-round" id="zoom-out" aria-label="Dézoomer">−</button>
            </div>
        </main>

        <nav id="tabs" class="tabs">
            <button type="button" data-tab="build"><span>🔨</span>Construire</button>
            <button type="button" data-tab="barn"><span>🛖</span>Grange</button>
            <button type="button" data-tab="market"><span>🏪</span>Marché</button>
            <button type="button" data-tab="cafe" hidden><span>☕</span>Café</button>
            <button type="button" data-tab="show"><span>🏆</span>Concours</button>
            <button type="button" data-tab="library" hidden><span>📚</span>Biblio</button>
            <button type="button" data-tab="land"><span>🗺️</span>Terrain</button>
            <button type="button" data-tab="admin"><span>⚙️</span>Admin</button>
        </nav>
    </div>

    <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
    <aside id="sheet" class="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-head">
            <h2 id="sheet-title"></h2>
            <button type="button" class="btn-round" id="sheet-close" aria-label="Fermer">×</button>
        </div>
        <div id="sheet-body" class="sheet-body"></div>
    </aside>

    <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
